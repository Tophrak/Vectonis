    <script>
      /* İlk boyama temayı bilsin: paket gelmeden tercihi köke işle (FOUC yok). */
      try {
        if (localStorage.getItem('nihairota_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
    <style>
      /* Kritik zemin: CSS paketi gelene kadarki karede bile doğru renk. */
      :root { background: #0b0c10; }
      :root[data-theme='light'] { background: #f4f4f7; }
    </style>
