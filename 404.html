<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/lux.css?v=4">
  <style>
    .nf { min-height: calc(100vh - 180px); display: grid; place-items: center; text-align: center; padding-block: 4rem; }
    .nf__code { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(5rem, 3rem + 10vw, 10rem); line-height: 1; background: var(--ember-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 1.2rem + 2vw, 2.6rem); letter-spacing: -0.015em; margin-top: 1rem; }
    .nf p { color: var(--ink-muted); max-width: 44ch; margin: 0.9rem auto 0; }
    .nf .btn { margin-top: 2.2rem; }
    .nf__mark { width: 66px; margin: 0 auto 1.6rem; opacity: 0.95; }
  </style>
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe geç</a>

  <header class="nav">
    <div class="wrap nav__inner">
      <a class="brand" href="/" aria-label="Vectonis ana sayfa">
        <img class="brand__logo" src="/assets/favicon.svg" width="40" height="40" alt="">
        <span class="brand__name">Vectonis<span class="brand__dot">.</span></span>
      </a>
      <nav class="nav__links" aria-label="Ana gezinme">

        <a class="nav__link" href="/hakkinda.html">Hakkında</a>
        <a class="nav__link" href="/iletisim.html">İletişim</a>
      </nav>
    </div>
  </header>

  <main id="icerik">
    <section class="nf wrap">
      <div>
        <svg class="nf__mark" viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <defs><linearGradient id="nfg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F0442E"/><stop offset="1" stop-color="#E8871B"/>
          </linearGradient></defs>
          <path d="M100 16 L172 42 V98 C172 145 143 174 100 186 C57 174 28 145 28 98 V42 Z" stroke="url(#nfg)" stroke-width="10" stroke-linejoin="round"/>
          <path d="M70 62 L100 132 L130 62" stroke="#1A1610" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="100" cy="68" r="9" fill="url(#nfg)"/>
        </svg>
        <div class="nf__code">404</div>
        <h1>Aradığınız sayfa <em>burada değil.</em></h1>
        <p>Adres değişmiş ya da hiç var olmamış olabilir. Sizi güzel bir yere götürelim.</p>
        <a class="btn btn--ink" href="/">Ana Sayfaya Dön</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span class="footer__brand">Vectonis Bilişim</span>
      <nav class="footer__nav" aria-label="Alt gezinme">
        <a href="/urunler/">Ürünler</a>

      </nav>
      <span class="footer__legal">© 2026 Vectonis. Tüm hakları saklıdır.</span>
